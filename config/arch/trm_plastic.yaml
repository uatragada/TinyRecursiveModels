name: recursive_reasoning.trm_plastic@PlasticTinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16
H_cycles: 3
L_cycles: 6
H_layers: 0
L_layers: 2
hidden_size: 512
num_heads: 8
expansion: 4
puzzle_emb_ndim: ${.hidden_size}
pos_encodings: rope
forward_dtype: bfloat16
mlp_t: False
puzzle_emb_len: 16
no_ACT_continue: True

controller_width: 128
controller_heads: 8
controller_layers: 3
controller_ff_multiplier: 4
controller_history: 4
adapter_rank: 4
adapter_alpha: 0.2
